{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block meta %}
    {% endblock meta %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav style="display: flex; align-items: center; gap: 15px;">
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_project' %}">Projects</a>
                
                <!-- status login & logout -->
                {% if user.is_authenticated %}
                    <span style="font-size: 0.9rem; color: #555;">Halo, <strong>{{ name }}</strong></span>
                    <a href="{% url 'main:logout' %}" style="padding: 4px 10px; background-color: #D86B88; color: white; border-radius: 4px; text-decoration: none;">Logout</a>
                {% else %}
                    <a href="{% url 'main:login' %}">Login</a>
                    <a href="{% url 'main:register' %}" style="padding: 4px 10px; background-color: #3182ce; color: white; border-radius: 4px; text-decoration: none;">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>

    {% block content %}
    {% endblock content %}

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
