<style>
  .toast-component {
    position: fixed !important;
    bottom: 2rem !important;
    right: 2rem !important;
    margin: 0 !important;
    padding: 1rem 1.5rem !important;
    border-radius: 12px !important;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15) !important;
    display: flex !important;
    align-items: center !important;
    gap: 1rem !important;
    transition: all 0.3s ease !important;
    background-color: #ffffff !important;
    border: 1px solid #f7d0dc !important;
    color: #2d2426 !important;
    z-index: 99999 !important;
  }

  .toast-hidden {
    opacity: 0 !important;
    visibility: hidden !important;
    transform: translateY(150%) !important;
    pointer-events: none !important;
  }

  .toast-show {
    opacity: 1 !important;
    visibility: visible !important;
    transform: translateY(0) !important;
    pointer-events: auto !important;
  }

  .toast-title {
    font-size: 0.95rem !important;
    font-weight: 700 !important;
    margin-bottom: 0.15rem !important;
    color: #2d2426 !important;
  }

  .toast-message {
    font-size: 0.85rem !important;
    color: #6e5e62 !important;
  }

  .toast-success { border-left: 5px solid #22c55e !important; }
  .toast-error { border-left: 5px solid #b42318 !important; }
  .toast-normal { border-left: 5px solid #d86b88 !important; }
</style>

<div id="toast" class="toast-component toast-hidden">
  <div>
    <div id="toast-title" class="toast-title">Notifikasi</div>
    <div id="toast-message" class="toast-message">Pesan notifikasi</div>
  </div>
</div>

<script>
  function showToast(title, message, type = 'normal') {
    const toast = document.getElementById('toast');
    const toastTitle = document.getElementById('toast-title');
    const toastMessage = document.getElementById('toast-message');

    if (!toast || !toastTitle || !toastMessage) return;

    toastTitle.innerText = title;
    toastMessage.innerText = message;

    toast.classList.remove('toast-success', 'toast-error', 'toast-normal');
    toast.classList.add(`toast-${type}`);

    toast.classList.remove('toast-hidden');
    toast.classList.add('toast-show');

    setTimeout(() => {
      toast.classList.remove('toast-show');
      toast.classList.add('toast-hidden');
    }, 3000);
  }
</script>
