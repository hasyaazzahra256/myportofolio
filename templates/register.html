{% extends 'base.html' %}

{% block meta %}
<title>Register - Portfolio</title>
{% endblock meta %}

{% block content %}
<div class="login" style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Register Account</h2>

  <form method="POST">
    {% csrf_token %}
    <table>
      {{ form.as_table }}
      <tr>
        <td></td>
        <td>
          <input type="submit" name="submit" value="Daftar" style="padding: 8px 16px; margin-top: 10px; cursor: pointer;" />
        </td>
      </tr>
    </table>
  </form>

  {% if messages %}
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</div>
{% endblock content %}
